# Publishes to PyPI via trusted publishing (OIDC). Register the trusted publisher on PyPI:
#   PyPI project:  pylibresidfp
#   Owner:         anarkiwi
#   Repository:    pylibresidfp
#   Workflow file: publish.yml
#   Environment:   pypi
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: command -v patch || yum -y install patch
          CIBW_TEST_COMMAND: >-
            python -c "from pylibresidfp import SID; s = SID(); s.write(24, 15); assert len(s.clock(20000)) > 0"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
